<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Login</title>

<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/auth.css">

<script src="../../assets/js/core/config.js"></script>
<script src="../../assets/js/core/storage.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/router.js"></script>

<script defer
src="../../assets/js/modules/auth/login.js">
</script>

</head>

<body class="auth-page">

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>

<div class="glass-card">

<h2>English Hub Login</h2>

<form id="loginForm">

<input id="email" type="email" placeholder="Email" required>

<input id="password" type="password" placeholder="Password" required>

<button id="loginBtn" type="button">Login</button>

<button type="button" onclick="Router.goRegister()"
class="secondary-btn">

Register
</button>

<div id="loginStatus" style="margin-top:14px;font-size:14px;color:#fde68a;min-height:20px"></div>

</form>

</div>

</body>

</html>
