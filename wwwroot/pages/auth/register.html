<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Register</title>

<link rel="stylesheet" href="../../assets/css/base.css?v=20260523f">
<link rel="stylesheet" href="../../assets/css/auth.css?v=20260523f">

<script src="../../assets/js/core/config.js?v=20260523f"></script>
<script src="../../assets/js/core/storage.js?v=20260523f"></script>
<script src="../../assets/js/core/api-client.js?v=20260523f"></script>
<script src="../../assets/js/core/router.js?v=20260523f"></script>
<script src="../../assets/js/modules/utils/validator.js?v=20260523f"></script>

<script defer
src="../../assets/js/modules/auth/register.js?v=20260523f">
</script>

</head>

<body class="auth-page">

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>

<div class="glass-card">

<h2>Create Account</h2>

<input
id="name"
placeholder="Full name">

<input
id="email"
placeholder="Email">

<input
id="phone"
placeholder="Phone">

<input
id="password"
type="password"
placeholder="Password">

<select id="role">

<option value="teacher">
Teacher
</option>

<option value="student">
Student
</option>

</select>

<button onclick="register()">
Register
</button>

<br><br>

<button
onclick="Router.goLogin()"
class="secondary-btn">

Back to login

</button>

</div>

</body>

</html>
