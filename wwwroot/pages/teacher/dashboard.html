<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Teacher Dashboard</title>

<link rel="stylesheet" href="../../assets/css/base.css?v=20260523f">
<link rel="stylesheet" href="../../assets/css/layout.css?v=20260523f">
<link rel="stylesheet" href="../../assets/css/components.css?v=20260523f">
<link rel="stylesheet" href="../../assets/css/skeleton.css?v=20260523f">
<link rel="stylesheet" href="../../assets/css/dashboard.css?v=20260523f">

<script src="../../assets/js/core/config.js?v=20260523f"></script>
<script src="../../assets/js/core/storage.js?v=20260523f"></script>
<script src="../../assets/js/core/api-client.js?v=20260523f"></script>
<script src="../../assets/js/core/router.js?v=20260523f"></script>
<script src="../../assets/js/core/guard.js?v=20260523f"></script>

<script src="../../assets/js/layout/sidebar.js?v=20260523f"></script>
<script src="../../assets/js/layout/layout.js?v=20260523f"></script>

<script src="../../assets/js/core/logout.js?v=20260523f"></script>

<script>
Guard.requireLogin();
Guard.requireTeacher();
</script>

<script defer src="../../assets/js/modules/teacher/dashboard.js?v=20260523f"></script>
</head>

<body>

<div id="layout"></div>

<div class="content">
<div class="container">

    <div class="topbar">
        <div>
            <div class="topbar-title">Teacher Dashboard</div>
            <p class="text-muted">Shared overview of classes, assignments, students, and submissions.</p>
        </div>
    </div>

    <div class="dashboard-grid">

        <div class="dashboard-card" onclick="Router.goTeacherClasses()">
            <div class="icon" data-label="CL"></div>
            <span>Classes</span>
        </div>

        <div class="dashboard-card" onclick="Router.goAssignments()">
            <div class="icon" data-label="AS"></div>
            <span>Assignments</span>
        </div>

        <div class="dashboard-card" onclick="Router.goStudents()">
            <div class="icon" data-label="ST"></div>
            <span>Students</span>
        </div>

        <div class="dashboard-card" onclick="Router.goAssignments()">
            <div class="icon" data-label="RS"></div>
            <span>Results</span>
        </div>

    </div>

    <div class="stats-grid">

        <div class="card">
            <p>Total Classes</p>
            <h2 id="totalClasses">0</h2>
        </div>

        <div class="card">
            <p>Assignments</p>
            <h2 id="totalAssignments">0</h2>
        </div>

        <div class="card">
            <p>Students</p>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="card">
            <p>Submissions</p>
            <h2 id="totalSubmissions">0</h2>
        </div>

    </div>

    <div class="card mt-4">
        <h4>Recent Activity</h4>
        <div id="notifications"></div>
    </div>

</div>
</div>

</body>
</html>
