<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Assignments</title>

<link rel="stylesheet" href="../../assets/css/base.css?v=20260523f">
<link rel="stylesheet" href="../../assets/css/layout.css?v=20260523f">
<link rel="stylesheet" href="../../assets/css/components.css?v=20260523f">
<link rel="stylesheet" href="../../assets/css/skeleton.css?v=20260523f">
<link rel="stylesheet" href="../../assets/css/dashboard.css?v=20260523f">

<script src="../../assets/js/core/config.js?v=20260523f"></script>
<script src="../../assets/js/core/storage.js?v=20260523f"></script>
<script src="../../assets/js/core/api-client.js?v=20260523f"></script>
<script src="../../assets/js/core/router.js?v=20260523f"></script>
<script src="../../assets/js/core/guard.js?v=20260523f"></script>
<script src="../../assets/js/modules/utils/validator.js?v=20260523f"></script>

<script src="../../assets/js/layout/sidebar.js?v=20260523f"></script>
<script src="../../assets/js/layout/layout.js?v=20260523f"></script>

<script defer src="../../assets/js/modules/teacher/assignments.js?v=20260523f"></script>

<script>
Guard.requireLogin();
Guard.requireTeacher();
</script>

</head>

<body>

<div id="layout"></div>

<div class="content">
<div class="container">

    <div class="topbar">
        <div class="topbar-title">Assignments</div>

        <div class="topbar-actions">
            <button onclick="history.back()">Back</button>
        </div>
    </div>

    <div class="card toolbar mb-4">
        <input id="keyword" placeholder="Search assignment">
        <button onclick="loadAssignments()">Search</button>

        <button onclick="openCreateModal()">+ Create</button>

        <button id="deleteModeBtn" onclick="toggleDeleteMode()">
            Delete Mode
        </button>

        <button id="confirmDeleteBtn"
                style="display:none;"
                onclick="deleteSelected()">
            Confirm Delete
        </button>
    </div>

    <!-- GRID -->
    <div id="assignmentList" class="assignment-grid"></div>

</div>
</div>

<!-- MODAL -->
<div class="modal" id="createModal">
    <div class="modal-box">

        <h3>Create Assignment</h3>

        <input id="assignmentName" placeholder="Assignment name">

        <select id="questionType">
            <option value="single_choice">Single choice</option>
            <option value="fill_blank">Fill blank</option>
        </select>

        <input id="questionCount" type="number" placeholder="Question count">

        <input id="openTime" type="datetime-local">
        <input id="closeTime" type="datetime-local">

        <label><input type="checkbox" id="showResult"> Show result</label>
        <label><input type="checkbox" id="showExplanation"> Show explanation</label>

        <div class="modal-actions">
            <button onclick="createAssignment()">Create</button>
            <button onclick="closeModal()">Cancel</button>
        </div>

    </div>
</div>

</body>
</html>
